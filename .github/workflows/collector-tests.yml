name: Collector tests

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector-tests.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm install
      - run: npm test
