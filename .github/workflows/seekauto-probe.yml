name: SeekAuto integration probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/seekauto-probe.trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Capture collector test result
        run: |
          set +e
          npm test > data/seekauto-test-log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> data/seekauto-test-log.txt
          exit 0
      - name: Probe public SeekAuto page assets
        run: node src/probe-seekauto.js
      - name: Commit probe report
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/data/seekauto-probe.json collector/data/seekauto-test-log.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture SeekAuto integration diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
