name: SeekAuto catalog sync

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/seekauto-catalog-sync.trigger"

permissions:
  contents: write

concurrency:
  group: live-catalog-sync
  cancel-in-progress: false

jobs:
  sync-seekauto-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore private SeekAuto collector state
        uses: actions/cache@v4
        with:
          path: collector/.state
          key: seekauto-catalog-state-${{ github.run_id }}
          restore-keys: |
            seekauto-catalog-state-

      - run: npm install
      - run: npm test

      - name: Save current public catalog as baseline
        run: cp data/global-public-catalog.json data/seekauto-public-catalog.baseline.json

      - name: Synchronize SeekAuto public inventory
        id: seekauto-sync
        continue-on-error: true
        run: >-
          npm run sync:seekauto --
          --limit 60
          --concurrency 2
          --recheck 20
          --missing-threshold 2
          --result data/seekauto-import-result.json

      - name: Build diff and apply health gate
        run: >-
          npm run audit:global-sync --
          --baseline data/seekauto-public-catalog.baseline.json
          --current data/global-public-catalog.json
          --import data/seekauto-import-result.json
          --report data/seekauto-sync-report.json
          --status data/seekauto-sync-status.json
          --min-items 1
          --max-error-rate 0.60
          --max-missing-rate 0.95

      - name: Upload SeekAuto sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seekauto-catalog-sync
          path: |
            collector/data/seekauto-public-catalog.baseline.json
            collector/data/global-public-catalog.json
            collector/data/seekauto-import-result.json
            collector/data/seekauto-sync-report.json
            collector/data/seekauto-sync-status.json
            assets/catalog-thumbs
          if-no-files-found: warn
          retention-days: 14

      - name: Publish healthy sanitized snapshot
        if: success()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f collector/data/seekauto-public-catalog.baseline.json
          rm -f collector/data/seekauto-import-result.json
          rm -f collector/data/seekauto-sync-report.json

          git add collector/data/global-public-catalog.json collector/data/seekauto-sync-status.json
          if [ -d assets/catalog-thumbs ]; then
            git add assets/catalog-thumbs
          fi
          if git diff --cached --quiet; then
            echo "Healthy SeekAuto public snapshot unchanged"
            exit 0
          fi

          git commit -m "Refresh SeekAuto catalog snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
