  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("avtocheck-theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : (systemDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
      }
    })();
  </script>

  <script src="app.js"></script>
  <script>
    document.addEventListener("click", (event) => {
      const requestButton = event.target.closest("[data-request-report]");
      const openButton = event.target.closest("[data-open-vehicle]");
      const card = event.target.closest(".catalog-card");
      if (card?.dataset.liveVehicle === "1") return;
      if (!requestButton && !openButton && !card) return;
      const id = requestButton?.dataset.requestReport || openButton?.dataset.openVehicle || card?.dataset.vehicleId;
      if (!id) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const action = requestButton ? "&action=report" : "";
      window.location.href = `vehicle.html?car=${encodeURIComponent(id)}${action}`;
    }, true);
  </script>
